# Configuration comes from server/.env (copy .env.example). Nothing secret is committed.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchangehub
      POSTGRES_USER: exchangehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env (see .env.example)}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - exchangehub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchangehub -d exchangehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/ExchangeHub.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=exchangehub;Username=exchangehub;Password=${POSTGRES_PASSWORD}
      Auth__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in server/.env (see .env.example)}

volumes:
  exchangehub-db:
