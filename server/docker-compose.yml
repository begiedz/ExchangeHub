services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchangehub
      POSTGRES_USER: exchangehub
      POSTGRES_PASSWORD: exchangehub
    ports:
      - "5433:5432"
    volumes:
      - exchangehub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchangehub -d exchangehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/ExchangeHub.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=exchangehub;Username=exchangehub;Password=exchangehub
      Auth__Jwt__SigningKey: local-dev-signing-key-change-me-0123456789

volumes:
  exchangehub-db:
